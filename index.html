    function App() {
      const [answers, setAnswers] = useState(() => {
        try {
          const saved = localStorage.getItem('mef_diagnostic_answers');
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          return {};
        }
      });

      const [userInfo, setUserInfo] = useState(() => {
        try {
          const saved = localStorage.getItem('mef_user_info');
          return saved ? JSON.parse(saved) : { name: '', age: '', profession: '', phone: '', income: '', goal: '' };
        } catch (e) {
          return { name: '', age: '', profession: '', phone: '', income: '', goal: '' };
        }
      });

      const [currentBlockIndex, setCurrentBlockIndex] = useState(0);
      const [isSubmitted, setIsSubmitted] = useState(() => {
        try {
          return localStorage.getItem('mef_diagnostic_submitted') === 'true';
        } catch (e) {
          return false;
        }
      });

      const [copyStatus, setCopyStatus] = useState(false);
      const [showResetModal, setShowResetModal] = useState(false);
      const [showIncompleteModal, setShowIncompleteModal] = useState(false);

      useEffect(() => {
        try {
          localStorage.setItem('mef_diagnostic_answers', JSON.stringify(answers));
          localStorage.setItem('mef_diagnostic_submitted', isSubmitted.toString());
          localStorage.setItem('mef_user_info', JSON.stringify(userInfo));
        } catch (e) {
          console.error("LocalStorage write error", e);
        }
      }, [answers, isSubmitted, userInfo]);

      const totalQuestionsCount = 60;
      const answeredCount = useMemo(() => {
        return Object.keys(answers).filter(k => answers[k] !== undefined && answers[k] !== null).length;
      }, [answers]);

      const progressPercent = Math.round((answeredCount / totalQuestionsCount) * 100);

      const handleScoreChange = (blockIdx, questionIdx, score) => {
        const key = `b${blockIdx}_q${questionIdx}`;
        setAnswers(prev => ({ ...prev, [key]: score }));
      };

      const blockScores = useMemo(() => {
        return MAP_DATA.map((block, bIdx) => {
          let sum = 0;
          let count = 0;
          block.questions.forEach((_, qIdx) => {
            const val = answers[`b${bIdx}_q${qIdx}`];
            if (val !== undefined && val !== null) {
              sum += Number(val);
              count++;
            }
          });
          return {
            blockIndex: bIdx,
            title: block.title,
            shortTitle: block.shortTitle,
            profileName: block.profileName,
            profileDesc: block.profileDesc,
            psychologicalCore: block.psychologicalCore,
            score: sum,
            maxScore: 50,
            completed: count === 10
          };
        });
      }, [answers]);

      const totalScore = useMemo(() => {
        return blockScores.reduce((acc, b) => acc + b.score, 0);
      }, [blockScores]);

      const currentTier = useMemo(() => {
        return SCORE_TIERS.find(t => totalScore >= t.min && totalScore <= t.max) || SCORE_TIERS[0];
      }, [totalScore]);

      // Sorted blocks by score descending
      const sortedBlocks = useMemo(() => {
        return [...blockScores].sort((a, b) => b.score - a.score);
      }, [blockScores]);

      const top1 = sortedBlocks[0] || blockScores[0];
      const top2 = sortedBlocks[1] || blockScores[1];
      const top3 = sortedBlocks[2] || blockScores[2];
      const lowestBlock = sortedBlocks[sortedBlocks.length - 1] || blockScores[5];

      // Generates the deep narrative text structured like the user's example
      const personalizedReportText = useMemo(() => {
        const name = userInfo.name ? userInfo.name.trim() : "Participante";
        const challenge = userInfo.goal ? userInfo.goal.trim() : "alcançar estabilidade e crescimento sem medo de errar";

        let text = `${name}, analisando seu Mapeamento Emocional Financeiro, você apresentou ${totalScore} pontos de um total de 300, resultado que, dentro da proposta do instrumento, indica um ${currentTier.title.toLowerCase()}.\n\n`;

        text += `O principal ponto identificado foi ${top1.shortTitle}, com ${top1.score}/50 pontos. Em seguida aparecem ${top2.shortTitle}, com ${top2.score}/50, e ${top3.shortTitle}, com ${top3.score}/50.\n\n`;

        text += `Isso mostra um padrão diferente de simplesmente "não saber lidar com dinheiro". Seu resultado sugere que o medo de errar, perder ou tomar uma decisão equivocada pode levar você a buscar um nível muito alto de controle e segurança antes de agir.\n\n`;

        if (userInfo.goal) {
          text += `Como você mesma(o) apontou que seu maior desafio é "${challenge}", existe uma conexão direta e importante entre o que você percebe conscientemente e o que aparece no mapeamento.\n\n`;
        }

        // Cycle logic based on top block
        if (top1.blockIndex === 2) { // Controle e Sobrecarga
          text += `O excesso de controle pode funcionar inicialmente como uma proteção:\n"Se eu controlar tudo, diminuo as chances de errar."\n\n`;
          text += `Mas existe um problema: quanto maior a necessidade de controlar, maior pode ser a sobrecarga emocional. E quando nenhuma decisão parece suficientemente segura, a pessoa pode começar a adiar, evitar ou questionar excessivamente suas próprias escolhas.\n\n`;
          text += `Isso pode criar um ciclo:\nMedo de perder → necessidade de controle → sobrecarga → insegurança → dificuldade para agir → sensação de incapacidade → mais necessidade de controle.\n\n`;
        } else if (top1.blockIndex === 0) { // Sobrevivência e Caos
          text += `O estado constante de urgência e apagamento de incêndios atua como um escudo protetor:\n"Se eu estiver sempre ocupado(a) resolvendo o agora, não preciso encarar decisões maiores sobre o futuro."\n\n`;
          text += `O ciclo gerado é:\nMedo do futuro → falta de planejamento → imprevisto/caos → correria extrema → exaustão → adiar decisões estratégicas → mais caos.\n\n`;

                    <span className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">
                      Análise Individualizada
                    </span>
                    <h3 className="text-xl sm:text-2xl font-black text-slate-900">
                      Diagnóstico Detalhado do seu Mapeamento
                    </h3>
                  </div>
                </div>

                {/* Texto Corrido Narrativo Explicativo */}
                <div className="prose prose-slate max-w-none text-slate-800 text-sm sm:text-base leading-relaxed space-y-4 bg-slate-50/70 p-5 sm:p-7 rounded-2xl border border-slate-200/70">
                  
                  <p className="font-semibold text-slate-900 text-base sm:text-lg border-b border-slate-200 pb-3">
                    {userInfo.name ? `${userInfo.name},` : "Olá,"} analisando seu Mapeamento Emocional Financeiro, você apresentou <span className="text-indigo-600 font-black">{totalScore} pontos</span> de um total de 300, resultado que indica um <strong className="text-indigo-700">{currentTier.title.toLowerCase()}</strong>.
                  </p>

                  <div className="p-4 rounded-xl bg-white border border-slate-200 shadow-sm space-y-1.5">
                    <p className="text-xs font-bold uppercase tracking-wider text-slate-500">Principais Blocos Identificados:</p>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs sm:text-sm font-semibold">
                      <div className="p-2.5 rounded-lg bg-rose-50 text-rose-800 border border-rose-100">
                        1º {top1.shortTitle}: <strong>{top1.score}/50 pts</strong>
                      </div>
                      <div className="p-2.5 rounded-lg bg-amber-50 text-amber-800 border border-amber-100">
                        2º {top2.shortTitle}: <strong>{top2.score}/50 pts</strong>
                      </div>
                      <div className="p-2.5 rounded-lg bg-indigo-50 text-indigo-800 border border-indigo-100">
                        3º {top3.shortTitle}: <strong>{top3.score}/50 pts</strong>
                      </div>
                    </div>
                  </div>

                  <p>
                    Isso mostra um padrão diferente de simplesmente <em>"não saber lidar com dinheiro"</em>. Seu resultado sugere que o medo de errar, perder ou tomar uma decisão equivocada pode levar você a buscar um nível muito alto de controle e segurança antes de agir.
                  </p>

                  {userInfo.goal && (
                    <div className="p-4 rounded-xl bg-indigo-50/80 border border-indigo-100 text-indigo-950 font-medium text-xs sm:text-sm leading-relaxed">
                      💡 <strong>Conexão Consciente:</strong> Como você mesma(o) apontou que seu maior desafio é <span className="underline decoration-indigo-300 font-bold">"{userInfo.goal}"</span>, existe uma conexão direta e importante entre o que você percebe conscientemente na sua rotina e o que aparece nos números deste mapeamento.
                    </div>
                  )}

                  {/* Análise do Ciclo Emocional do Bloco Dominante */}
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
                    <h4 className="font-bold text-slate-900 text-sm sm:text-base flex items-center gap-2 text-indigo-700">
                      <Icon name="Lightbulb" className="w-5 h-5 text-amber-500" />
                      Como Funciona o Ciclo Emocional de {top1.shortTitle}
                    </h4>
                    
                    <p className="text-xs sm:text-sm text-slate-700">
                      O foco em {top1.shortTitle.toLowerCase()} funciona inicialmente como um mecanismo inconsciente de proteção:
                    </p>
                    <blockquote className="border-l-4 border-indigo-500 pl-3 py-1 italic text-slate-800 text-xs sm:text-sm bg-indigo-50/50 rounded-r-lg">
                      "{top1.psychologicalCore}"
                    </blockquote>

                    <p className="text-xs sm:text-sm text-slate-700 pt-1">
                      <strong>O problema central:</strong> Quanto maior a necessidade de manter essa proteção, maior torna-se a sobrecarga emocional. Quando nenhuma decisão parece suficientemente segura, a pessoa passa a adiar, evitar ou questionar excessivamente suas próprias escolhas.
                    </p>

                    <div className="p-3 bg-slate-900 text-slate-100 rounded-xl text-xs font-mono font-medium leading-relaxed">
                      🔄 <strong>O Ciclo Vicioso Identificado:</strong><br/>
                      {top1.blockIndex === 2 && "Medo de perder → Necessidade de controle → Sobrecarga → Insegurança → Dificuldade para agir → Sensação de incapacidade → Mais necessidade de controle."}
                      {top1.blockIndex === 0 && "Medo do futuro → Falta de planejamento → Imprevisto/Caos → Correria extrema → Exaustão → Adiar decisões estratégicas → Mais caos."}
                      {top1.blockIndex === 1 && "Desejo de expansão → Proximidade de bons resultados → Pico de ansiedade → Autoboicote silencioso → Estagnação → Alívio temporário → Culpa."}
                      {top1.blockIndex === 3 && "Oportunidade de ganho → Culpa inconsciente de trair origens → Recuo de ganhos → Retorno ao padrão antigo → Alívio de pertencer → Desejo reprimido."}
                      {top1.blockIndex === 4 && "Início de projeto promissor → Proximidade de consolidação → Criação de distrações → Fracasso/Regressão → Confirmação 'não consigo' → Reinício."}
                      {top1.blockIndex === 5 && "Necessidade de decidir → Medo de errar/decepcionar → Busca por validação externa → Paralisia/Dúvida → Perda da oportunidade → Sensação de incapacidade."}
                    </div>
                  </div>

                  {/* Comparativo dos blocos secundários */}
                  <div className="space-y-2 text-xs sm:text-sm text-slate-700">
                    <p>
                      • <strong>{top2.shortTitle} ({top2.score}/50):</strong> Nesse resultado, o crescimento financeiro pode estar emocionalmente associado a riscos, responsabilidades elevadas ou possibilidade de perdas. Assim, desejar prosperar e, ao mesmo tempo, ter medo das consequências de crescer podem coexistir no seu dia a dia.
                    </p>
                    <p>
                      • <strong>{top3.shortTitle} ({top3.score}/50):</strong> Mostra uma influência relevante. Isso indica que parte das suas decisões ainda pode ser tomada buscando principalmente segurança imediata e alívio do estresse diário.
                    </p>
                    <p>
                      • <strong>{lowestBlock.shortTitle} ({lowestBlock.score}/50):</strong> Foi um dos seus menores índices. Isso indica que a dinâmica deste bloco não é a causa raiz primária do seu bloqueio financeiro atual.
                    </p>
                  </div>

                </div>

              </div>

              {}
              {/* SEÇÃO DE SOLUÇÕES & TRÊS PILARES DO AMADURECIMENTO EMOCIONAL */}
              <div className="bg-gradient-to-br from-indigo-900 via-slate-900 to-slate-950 text-white rounded-2xl p-6 sm:p-9 shadow-xl space-y-6">
                
                <div className="flex items-center gap-3 border-b border-white/10 pb-4">
                  <div className="w-10 h-10 rounded-xl bg-amber-400 text-slate-950 flex items-center justify-center font-bold shadow-md shadow-amber-400/20">
                    <Icon name="Sparkles" className="w-6 h-6" />
                  </div>
                  <div>
                    <span className="text-xs font-bold text-amber-400 uppercase tracking-wider">
                      Caminho Prático de Transformação
                    </span>
                    <h3 className="text-xl sm:text-2xl font-black text-white">
                      Solução & Os Três Pilares do Amadurecimento
                    </h3>
                  </div>
                </div>

                <p className="text-slate-300 text-xs sm:text-sm leading-relaxed">
                  Dentro da teoria do <strong>Amadurecimento Emocional Financeiro</strong>, o objetivo não é eliminar o medo, mas aprender a não permitir que o medo seja o responsável pelas suas decisões diárias.
                </p>

                <div className="p-4 rounded-xl bg-white/5 border border-white/10 text-xs sm:text-sm text-indigo-200 italic leading-relaxed">
                  "Uma pessoa emocionalmente madura não é aquela que nunca sente medo de perder. É aquela que consegue reconhecer o medo, compreender sua origem e ainda assim tomar decisões conscientes e direcionadas."
                </div>

                {/* Cards dos 3 Pilares */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                  
                  <div className="bg-white/10 rounded-xl p-5 border border-white/10 backdrop-blur-sm space-y-2">
                    <div className="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 font-black text-xs flex items-center justify-center">
                      1
                    </div>
                    <h4 className="font-extrabold text-white text-sm uppercase tracking-wide">
                      ACEITAÇÃO
                    </h4>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      Aceitar que errar e perder fazem parte do processo de crescimento e que nenhuma decisão financeira oferece risco absolutamente zero.
                    </p>
                  </div>

                  <div className="bg-white/10 rounded-xl p-5 border border-white/10 backdrop-blur-sm space-y-2">
                    <div className="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-300 font-black text-xs flex items-center justify-center">
                      2
                    </div>
                    <h4 className="font-extrabold text-white text-sm uppercase tracking-wide">
                      ENTENDIMENTO
                    </h4>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      Compreender a real origem da trava. É medo de perder dinheiro? De fracassar? De decepcionar alguém? Ou de perder a sensação de segurança?
                    </p>
                  </div>

                  <div className="bg-white/10 rounded-xl p-5 border border-white/10 backdrop-blur-sm space-y-2">
                    <div className="w-8 h-8 rounded-lg bg-amber-500/20 text-amber-300 font-black text-xs flex items-center justify-center">
                      3
                    </div>
                    <h4 className="font-extrabold text-white text-sm uppercase tracking-wide">
                      ADMIRAÇÃO
                    </h4>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      Reconhecer sua própria capacidade de aprender, recalcular rotas e recomeçar. Não medir seu valor pessoal pelo resultado de uma única escolha.
                    </p>
                  </div>

                </div>

                {/* Virada de Chave de Atitude */}
                <div className="p-5 rounded-2xl bg-gradient-to-r from-amber-500/20 to-indigo-500/20 border border-amber-400/30 text-xs sm:text-sm text-slate-100 space-y-2">
                  <h5 className="font-bold text-amber-300 flex items-center gap-1.5 uppercase tracking-wider text-xs">
                    <Icon name="HeartHandshake" className="w-4 h-4" />
                    Mudança Fundamental de Postura
                  </h5>
                  <p className="leading-relaxed">
                    O desenvolvimento principal para você está na construção de uma relação madura com o risco: <strong>segurança não significa controlar tudo.</strong>
                  </p>
                  <blockquote className="font-serif italic text-white text-sm sm:text-base border-l-2 border-amber-400 pl-3 my-2">
                    "Eu não tenho como garantir que não vou perder. Mas posso me preparar, analisar, decidir e confiar na minha capacidade de lidar com o que acontecer."
                  </blockquote>
                  <p className="text-slate-300 text-xs pt-1">
                    Esse é o caminho definitivo para transformar o medo de errar em capacidade de decidir, e o excesso de controle em consciência e autonomia.
                  </p>
                </div>

                <div className="text-[11px] text-slate-400 italic pt-2 border-t border-white/10">
                  * Este mapeamento é uma ferramenta de reflexão e identificação de padrões emocionais e comportamentais, não constituindo um diagnóstico clínico ou médico.
                </div>

              </div>

              {/* Gráfico de Barras dos 6 Blocos e Perfil Dominante */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                {/* Card Perfil Dominante */}
                <div className="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-sm flex flex-col justify-between">
                  <div>
                    <div className="flex items-center gap-2 text-indigo-600 text-xs font-bold uppercase tracking-wider mb-2">
                      <Icon name="Target" className="w-4 h-4" />
                      Perfil Dominante Identificado
                    </div>
                    <h3 className="text-xl font-black text-slate-900 mb-2">
                      {top1.profileName}
                    </h3>
                    <p className="text-slate-600 text-xs sm:text-sm leading-relaxed mb-4">
                      "{top1.profileDesc}"
                    </p>
                    <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 text-xs space-y-1.5">
                      <div className="flex justify-between text-slate-600">
                        <span>Pontuação no Bloco:</span>
                        <strong className="text-slate-900 text-sm">{top1.score} / 50 pts</strong>
                      </div>
                      <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden mt-2">
                        <div className="bg-indigo-600 h-full rounded-full" style={{ width: `${(top1.score / 50) * 100}%` }}></div>
                      </div>
                    </div>
                  </div>

                  <div className="mt-6 pt-4 border-t border-slate-100 text-xs text-slate-600">
                    💡 <strong>Foco Imediato:</strong> {currentTier.action}
                  </div>
                </div>

                {/* Gráfico de Barras */}
                <div className="bg-white rounded-2xl border border-slate-200/80 p-5 sm:p-6 shadow-sm flex flex-col justify-between">
                  <div className="flex items-center justify-between mb-2">
                    <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider flex items-center gap-2">
                      <Icon name="BarChart3" className="w-4 h-4 text-indigo-600" />
                      Visão Geral dos 6 Blocos
                    </h3>
                    <span className="text-xs text-slate-400">0 - 50 Pts</span>
                  </div>

                  <div className="h-64 w-full">
                    <ResponsiveContainer width="100%" height="100%">
                      <BarChart data={blockScores} layout="vertical" margin={{ top: 5, right: 10, left: 10, bottom: 5 }}>
                        <XAxis type="number" domain={[0, 50]} hide />
                        <YAxis type="category" dataKey="shortTitle" width={110} tick={{ fontSize: 10, fill: '#475569' }} />
                        <Tooltip 
                          formatter={(value) => [`${value} / 50 pts`, 'Pontuação']}
                          contentStyle={{ backgroundColor: '#0f172a', borderRadius: '8px', color: '#fff', fontSize: '12px' }}
                        />
                        <Bar dataKey="score" radius={[0, 6, 6, 0]}>
                          {blockScores.map((entry, index) => (
                            <Cell key={`cell-${index}`} fill={entry.score >= 35 ? '#ef4444' : entry.score >= 20 ? '#f59e0b' : '#10b981'} />
                          ))}
                        </Bar>
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                </div>

              </div>

              {/* Botões de Ação no Final */}
              <div className="bg-white rounded-2xl border border-slate-200/80 p-6 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
                <button
                  onClick={handleCopyReport}
                  className="w-full sm:w-auto px-6 py-3.5 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center gap-2 transition-all shadow-md"
                >
                  <Icon name="Copy" className="w-4 h-4" />
                  {copyStatus ? "Relatório Completo Copiado!" : "Copiar Relatório Completo em Texto"}
                </button>

                <div className="flex items-center gap-3 w-full sm:w-auto">
                  <button
                    onClick={() => {
                      setIsSubmitted(false);
                      window.scrollTo({ top: 0, behavior: 'smooth' });
                    }}
                    className="w-full sm:w-auto px-5 py-3.5 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 transition-all"
                  >
                    Revisar Respostas
                  </button>

                  <button
                    onClick={() => setShowResetModal(true)}
                    className="w-full sm:w-auto px-5 py-3.5 rounded-xl text-xs font-bold bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 flex items-center justify-center gap-2 transition-all"
                  >
                    <Icon name="RefreshCw" className="w-4 h-4" />
                    Refazer Teste
                  </button>
                </div>
              </div>

            </div>
          )}

          {}
          {/* Menu de Navegação no Rodapé (Mobile App Style) */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-xl px-2 py-2">
            <div className="max-w-md mx-auto grid grid-cols-4 items-center justify-items-center">
              
              <button
                onClick={() => {
                  setIsSubmitted(false);
                  window.scrollTo({ top: 0, behavior: 'smooth' });
                }}
                className={`w-full flex flex-col items-center justify-center py-1 rounded-xl transition-all ${
                  !isSubmitted ? 'text-indigo-600 font-bold' : 'text-slate-500 hover:text-slate-900'
                }`}
              >
                <Icon name="Brain" className="w-5 h-5 mb-0.5" />
                <span className="text-[11px]">Teste</span>
              </button>

              <button
                onClick={() => {
                  if (answeredCount === 0) {
                    setShowIncompleteModal(true);
                  } else {
                    setIsSubmitted(true);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                  }
                }}
                className={`w-full flex flex-col items-center justify-center py-1 rounded-xl transition-all relative ${
                  isSubmitted ? 'text-indigo-600 font-bold' : 'text-slate-500 hover:text-slate-900'
                }`}
              >
                <Icon name="BarChart3" className="w-5 h-5 mb-0.5" />
                <span className="text-[11px]">Resultado</span>
                {answeredCount > 0 && !isSubmitted && (
                  <span className="absolute top-1 right-3 w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span>
                )}
              </button>

              <button
                onClick={handleCopyReport}
                className="w-full flex flex-col items-center justify-center py-1 rounded-xl text-slate-500 hover:text-slate-900 transition-all"
              >
                <Icon name="Copy" className="w-5 h-5 mb-0.5" />
                <span className="text-[11px]">{copyStatus ? 'Copiado!' : 'Copiar'}</span>
              </button>

              <button
                onClick={() => setShowResetModal(true)}
                className="w-full flex flex-col items-center justify-center py-1 rounded-xl text-rose-600 hover:text-rose-700 transition-all"
              >
                <Icon name="RefreshCw" className="w-5 h-5 mb-0.5" />
                <span className="text-[11px] font-medium">Refazer</span>
              </button>

            </div>
          </nav>

          {/* Modal de Confirmação para Refazer Teste */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto">
                  <Icon name="RefreshCw" className="w-6 h-6" />
                </div>
                <div className="text-center">
                  <h3 className="text-lg font-bold text-slate-900">Refazer Teste em Branco?</h3>
                  <p className="text-slate-600 text-sm mt-1">
                    Esta ação irá <strong>limpar todas as suas 60 respostas</strong> e seus dados cadastrais, reiniciando o diagnóstico do zero.
                  </p>
                </div>
                <div className="flex items-center gap-3 pt-2">
                  <button
                    type="button"
                    onClick={() => setShowResetModal(false)}
                    className="flex-1 py-2.5 px-4 rounded-xl border border-slate-300 text-slate-700 text-xs font-bold hover:bg-slate-50 transition-colors"
                  >
                    Cancelar
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmReset}
                    className="flex-1 py-2.5 px-4 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold transition-colors shadow-md shadow-rose-200"
                  >
                    Sim, Limpar Tudo
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal para Diagnóstico Incompleto */}
          {showIncompleteModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                <div className="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto">
                  <Icon name="AlertCircle" className="w-6 h-6" />
                </div>
                <div className="text-center">
                  <h3 className="text-lg font-bold text-slate-900">Visualizar Diagnóstico Parcial?</h3>
                  <p className="text-slate-600 text-sm mt-1">
                    Você preencheu <strong>{answeredCount} de 60 questões</strong>. Para um mapeamento 100% preciso, recomendamos responder todos os blocos.
                  </p>
                </div>
                <div className="flex flex-col gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => {
                      setShowIncompleteModal(false);
                      setIsSubmitted(true);
                      window.scrollTo({ top: 0, behavior: 'smooth' });
                    }}
                    className="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition-colors shadow-md shadow-indigo-100"
                  >
                    Ver Diagnóstico Parcial
                  </button>
                  <button
                    type="button"
                    onClick={() => setShowIncompleteModal(false)}
                    className="w-full py-2.5 px-4 rounded-xl border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50 transition-colors"
                  >
                    Continuar Respondendo
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer discreto */}
          <footer className="mt-10 text-center text-xs text-slate-400 py-4">
            Mapeamento Emocional Financeiro • Sistema de Diagnóstico & Amadurecimento Emocional
          </footer>

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
