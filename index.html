    function App() {
      const [answers, setAnswers] = useState(() => {
        try {
          const saved = localStorage.getItem('mef_diagnostic_answers');
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          return {};
        }
      });

      const [userInfo, setUserInfo] = useState(() => {
        try {
          const saved = localStorage.getItem('mef_user_info');
          return saved ? JSON.parse(saved) : { name: '', age: '', profession: '', phone: '', income: '', goal: '' };
        } catch (e) {
          return { name: '', age: '', profession: '', phone: '', income: '', goal: '' };

      });

      const [currentBlockIndex, setCurrentBlockIndex] = useState(0);
      const [isSubmitted, setIsSubmitted] = useState(() => {
        try {
          return localStorage.getItem('mef_diagnostic_submitted') === 'true';
        } catch (e) {
          return false;
        }
      });

      const [copyStatus, setCopyStatus] = useState(false);
      const [showResetModal, setShowResetModal] = useState(false);
      const [showIncompleteModal, setShowIncompleteModal] = useState(false);

      useEffect(() => {
        try {
          localStorage.setItem('mef_diagnostic_answers', JSON.stringify(answers));
          localStorage.setItem('mef_diagnostic_submitted', isSubmitted.toString());
          localStorage.setItem('mef_user_info', JSON.stringify(userInfo));
        } catch (e) {
          console.error("LocalStorage write error", e);
        }
      }, [answers, isSubmitted, userInfo]);

      const totalQuestionsCount = 60;
      const answeredCount = useMemo(() => {
        return Object.keys(answers).filter(k => answers[k] !== undefined && answers[k] !== null).length;
      }, [answers]);

      const progressPercent = Math.round((answeredCount / totalQuestionsCount) * 100);

      const handleScoreChange = (blockIdx, questionIdx, score) => {
        const key = `b${blockIdx}_q${questionIdx}`;
        setAnswers(prev => ({ ...prev, [key]: score }));
      };

      const blockScores = useMemo(() => {
        return MAP_DATA.map((block, bIdx) => {
          let sum = 0;
          let count = 0;
          block.questions.forEach((_, qIdx) => {
            const val = answers[`b${bIdx}_q${qIdx}`];
            if (val !== undefined && val !== null) {
              sum += Number(val);
              count++;
            }
          });
          return {
            blockIndex: bIdx,
            title: block.title,
            shortTitle: block.shortTitle,
            profileName: block.profileName,
            profileDesc: block.profileDesc,
            psychologicalCore: block.psychologicalCore,
            marbleLayer: block.marbleLayer,
            score: sum,
            maxScore: 50,
            completed: count === 10
          };
        });
      }, [answers]);

      const totalScore = useMemo(() => {
        return blockScores.reduce((acc, b) => acc + b.score, 0);
      }, [blockScores]);

      const currentTier = useMemo(() => {
        return SCORE_TIERS.find(t => totalScore >= t.min && totalScore <= t.max) || SCORE_TIERS[0];

                }`}
              >
                <Icon name="BarChart3" className="w-5 h-5 mb-0.5" />
                <span className="text-[11px]">Resultado</span>
                {answeredCount > 0 && !isSubmitted && (
                  <span className="absolute top-1 right-3 w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span>
                )}
              </button>

              <button
                onClick={handleCopyReport}
                className="w-full flex flex-col items-center justify-center py-1 rounded-xl text-slate-500 hover:text-slate-900 transition-all"
              >
                <Icon name="Copy" className="w-5 h-5 mb-0.5" />
                <span className="text-[11px]">{copyStatus ? 'Copiado!' : 'Copiar'}</span>
              </button>

              <button
                onClick={() => setShowResetModal(true)}
                className="w-full flex flex-col items-center justify-center py-1 rounded-xl text-rose-600 hover:text-rose-700 transition-all"
              >
                <Icon name="RefreshCw" className="w-5 h-5 mb-0.5" />
                <span className="text-[11px] font-medium">Refazer</span>
              </button>

            </div>
          </nav>

          {/* Modal de Limpeza */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto">
                  <Icon name="RefreshCw" className="w-6 h-6" />
                </div>
                <div className="text-center">
                  <h3 className="text-lg font-bold text-slate-900">Deseja Zerar Suas Respostas?</h3>
                  <p className="text-slate-600 text-sm mt-1">
                    Esta ação irá <strong>limpar todas as suas 60 respostas</strong> e seus dados cadastrais para você reiniciar o teste do zero.
                  </p>
                </div>
                <div className="flex items-center gap-3 pt-2">
                  <button
                    type="button"
                    onClick={() => setShowResetModal(false)}
                    className="flex-1 py-2.5 px-4 rounded-xl border border-slate-300 text-slate-700 text-xs font-bold hover:bg-slate-50 transition-colors"
                  >
                    Cancelar
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmReset}
                    className="flex-1 py-2.5 px-4 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold transition-colors shadow-md shadow-rose-200"
                  >
                    Sim, Limpar Tudo
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal para Diagnóstico Incompleto */}
          {showIncompleteModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                <div className="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto">
                  <Icon name="AlertCircle" className="w-6 h-6" />
                </div>
                <div className="text-center">
                  <h3 className="text-lg font-bold text-slate-900">Ver Resultado Parcial?</h3>
                  <p className="text-slate-600 text-sm mt-1">
                    Você respondeu <strong>{answeredCount} de 60 questões</strong>. Para um resultado 100% preciso, recomendamos responder todas as perguntas.
                  </p>
                </div>
                <div className="flex flex-col gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => {
                      setShowIncompleteModal(false);
                      setIsSubmitted(true);
                      window.scrollTo({ top: 0, behavior: 'smooth' });
                    }}
                    className="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition-colors shadow-md shadow-indigo-100"
                  >
                    Ver Resultado Parcial Mesmo Assim
                  </button>
                  <button
                    type="button"
                    onClick={() => setShowIncompleteModal(false)}
                    className="w-full py-2.5 px-4 rounded-xl border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50 transition-colors"
                  >
                    Continuar Respondendo
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer discreto */}
          <footer className="mt-10 text-center text-xs text-slate-400 py-4">
            Mapeamento Emocional Financeiro — Guia Prático de Organização e Paz com o Dinheiro
          </footer>

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
