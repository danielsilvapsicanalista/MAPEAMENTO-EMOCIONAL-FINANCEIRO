    function App() {
      const [answers, setAnswers] = useState(() => {
        try {

      const [isSubmitted, setIsSubmitted] = useState(() => {
        try {
          return localStorage.getItem('mef_tech_submitted') === 'true';
        } catch (e) {
          return false;
        }
      });

      const [copyStatus, setCopyStatus] = useState(false);
      const [showResetModal, setShowResetModal] = useState(false);
      const [showIncompleteModal, setShowIncompleteModal] = useState(false);

      useEffect(() => {
        try {
          localStorage.setItem('mef_tech_answers', JSON.stringify(answers));
          localStorage.setItem('mef_tech_submitted', isSubmitted.toString());
          localStorage.setItem('mef_tech_user', JSON.stringify(userInfo));
        } catch (e) {
          console.error("LocalStorage write error", e);
        }
      }, [answers, isSubmitted, userInfo]);

      const totalQuestionsCount = 60;
      const answeredCount = useMemo(() => {
        return Object.keys(answers).filter(k => answers[k] !== undefined && answers[k] !== null).length;
      }, [answers]);

      const progressPercent = Math.round((answeredCount / totalQuestionsCount) * 100);

      const handleScoreChange = (blockIdx, questionIdx, score) => {
        const key = `b${blockIdx}_q${questionIdx}`;
        setAnswers(prev => ({ ...prev, [key]: score }));
      };

      const blockScores = useMemo(() => {
        return MAP_DATA.map((block, bIdx) => {
          let sum = 0;
          let count = 0;
          block.questions.forEach((_, qIdx) => {
            const val = answers[`b${bIdx}_q${qIdx}`];
            if (val !== undefined && val !== null) {
              sum += Number(val);
              count++;
            }
          });
          return {
            blockIndex: bIdx,
            title: block.title,
            shortTitle: block.shortTitle,
            technicalTag: block.technicalTag,
            profileName: block.profileName,
            profileDesc: block.profileDesc,
            psychologicalCore: block.psychologicalCore,
            strengthAsset: block.strengthAsset,
            score: sum,
            maxScore: 50,
            completed: count === 10
          };
        });
      }, [answers]);

      const totalScore = useMemo(() => {
        return blockScores.reduce((acc, b) => acc + b.score, 0);
      }, [blockScores]);

      const currentTier = useMemo(() => {
        return SCORE_TIERS.find(t => totalScore >= t.min && totalScore <= t.max) || SCORE_TIERS[0];
      }, [totalScore]);

      const sortedBlocks = useMemo(() => {
        return [...blockScores].sort((a, b) => b.score - a.score);
      }, [blockScores]);

      const dominant1 = sortedBlocks[0] || blockScores[0];
      const dominant2 = sortedBlocks[1] || blockScores[1];
      const dominant3 = sortedBlocks[2] || blockScores[2];
      
      const strengthsList = useMemo(() => {
        return [...blockScores].sort((a, b) => a.score - b.score).slice(0, 3);
      }, [blockScores]);

      const technicalReportText = useMemo(() => {
        const name = userInfo.name ? userInfo.name.trim() : "Participante";
        const goal = userInfo.goal ? userInfo.goal.trim() : "Crescer com estabilidade e manter o dinheiro acumulado";
        const profession = userInfo.profession ? userInfo.profession.trim() : "Não especificada";

        let text = `=================================================================\n`;
        text += `RELATÓRIO DE AVALIAÇÃO COMPORTAMENTAL E FINANCEIRA\n`;
        text += `Diagnóstico Claro de Padrões Emocionais e Plano de Ação Prático\n`;
        text += `=================================================================\n\n`;

        text += `DADOS DO PARTICIPANTE:\n`;
        text += `• Nome: ${name}\n`;
        text += `• Profissão / Atuação: ${profession}\n`;
        text += `• Objetivo Principal: "${goal}"\n`;
        text += `• Nível de Fricção Atual: ${totalScore} de 300 pontos (${currentTier.title})\n\n`;

        text += `-----------------------------------------------------------------\n`;
        text += `RESUMO DOS SEUS RESULTADOS\n`;
        text += `-----------------------------------------------------------------\n`;
        text += `Este teste mede quanto a ansiedade, o estresse ou certos hábitos atrapalham suas decisões com dinheiro.\n`;
        text += `Pontuação Geral: ${totalScore}/300.\n`;
        text += `• Ponto Principal a Melhorar: ${dominant1.shortTitle} (${dominant1.score}/50 pts)\n`;
        text += `• Segundo Ponto de Atenção: ${dominant2.shortTitle} (${dominant2.score}/50 pts)\n`;
        text += `• Terceiro Ponto de Atenção: ${dominant3.shortTitle} (${dominant3.score}/50 pts)\n`;
        text += `• Sua Maior Força Atual: ${strengthsList[0].shortTitle} (${strengthsList[0].score}/50 pts)\n\n`;

        text += `=================================================================\n`;
        text += `ETAPA 1: SUAS MAIORES QUALIDADES E PONTOS FORTES\n`;

                </div>
              </div>

              {/* =================================================================== */}
              {/* ETAPA 1: PONTOS FORTES E POTENCIALIDADES IDENTIFICADAS */}
              {/* =================================================================== */}
              <div className="bg-slate-900/90 rounded-2xl border border-emerald-500/30 p-6 sm:p-8 shadow-xl space-y-6 relative">
                <div className="flex items-center gap-3 border-b border-slate-800 pb-4">
                  <div className="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center font-bold">
                    <Icon name="TrendingUp" className="w-6 h-6" />
                  </div>
                  <div>
                    <span className="text-xs font-mono font-bold text-emerald-400 uppercase tracking-widest">
                      ETAPA 1 DE 3 — SUAS MAIORES QUALIDADES
                    </span>
                    <h3 className="text-xl sm:text-2xl font-black text-white">
                      Pontos Fortes e Habilidades que Você Já Possui
                    </h3>
                  </div>
                </div>

                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                  Estes são os blocos em que você tirou as notas mais baixas de estresse. Isso significa que são suas <strong>zonas de força e tranquilidade</strong>, onde você pensa melhor e não costuma se autossabotar. Você vai usar essas habilidades para corrigir os seus pontos fracos.
                </p>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                  {strengthsList.map((st, idx) => (
                    <div key={st.blockIndex} className="bg-slate-950/80 border border-emerald-500/20 rounded-xl p-4 space-y-3 flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between mb-2">
                          <span className="px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-mono font-bold">
                            PONTO FORTE #{idx + 1}
                          </span>
                          <span className="text-xs font-mono text-emerald-400 font-bold">{st.score} / 50 pts</span>
                        </div>
                        <h4 className="font-bold text-white text-sm uppercase tracking-tight">{st.shortTitle}</h4>
                        <p className="text-xs text-slate-300 mt-2 leading-relaxed">
                          {st.strengthAsset}
                        </p>
                      </div>
                      <div className="pt-3 border-t border-slate-800/80 text-[11px] text-emerald-400/90 font-medium">
                        ✓ Você toma boas decisões nesta área
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* =================================================================== */}
              {/* ETAPA 2: GARGALOS CRÍTICOS E PONTOS DE CORREÇÃO (DIAGNÓSTICO TÉCNICO) */}
              {/* =================================================================== */}
              <div className="bg-slate-900/90 rounded-2xl border border-rose-500/30 p-6 sm:p-8 shadow-xl space-y-6">
                <div className="flex items-center gap-3 border-b border-slate-800 pb-4">
                  <div className="w-10 h-10 rounded-xl bg-rose-500/20 text-rose-400 border border-rose-500/30 flex items-center justify-center font-bold">
                    <Icon name="AlertTriangle" className="w-6 h-6" />
                  </div>
                  <div>
                    <span className="text-xs font-mono font-bold text-rose-400 uppercase tracking-widest">
                      ETAPA 2 DE 3 — SEUS PONTOS DE ATENÇÃO
                    </span>
                    <h3 className="text-xl sm:text-2xl font-black text-white">
                      O Que Está Atrapalhando Suas Finanças
                    </h3>
                  </div>
                </div>

                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                  Estes foram os blocos onde você teve maior pontuação. Eles mostram onde a ansiedade, o estresse ou velhos hábitos costumam fazer você perder dinheiro ou energia:
                </p>

                <div className="space-y-4">
                  {[dominant1, dominant2, dominant3].map((dominant, idx) => (
                    <div key={dominant.blockIndex} className="bg-slate-950/90 border border-slate-800 rounded-xl p-5 space-y-3">
                      <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/80 pb-2.5">
                        <div className="flex items-center gap-2">
                          <span className="w-6 h-6 rounded bg-rose-500/20 text-rose-400 font-mono font-bold text-xs flex items-center justify-center">
                            #{idx + 1}
                          </span>
                          <h4 className="font-bold text-white text-sm uppercase tracking-wide">{dominant.shortTitle}</h4>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-mono text-rose-400 font-bold bg-rose-500/10 border border-rose-500/20 px-2.5 py-0.5 rounded">
                            {dominant.score} / 50 pts
                          </span>
                          <span className="text-[10px] font-mono text-slate-400 uppercase hidden sm:inline">{dominant.technicalTag}</span>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs pt-1">
                        <div className="space-y-1 bg-slate-900/50 p-3 rounded-lg border border-slate-800">
                          <strong className="text-indigo-400 font-mono block uppercase text-[10px] tracking-wider">Como sua mente reage:</strong>
                          <p className="text-slate-200 leading-relaxed">{dominant.psychologicalCore}</p>
                        </div>

                        <div className="space-y-1 bg-slate-900/50 p-3 rounded-lg border border-slate-800">
                          <strong className="text-rose-400 font-mono block uppercase text-[10px] tracking-wider">O impacto prático no seu bolso:</strong>
                          <p className="text-slate-200 leading-relaxed">
                            {dominant.blockIndex === 0 && "Faz você perder dinheiro e tempo com decisões tomadas na correria de última hora, desorganização e falta de planejamento."}
                            {dominant.blockIndex === 1 && "Faz você gastar ou abrir mão do seu lucro sem perceber, criando uma dificuldade para manter o dinheiro guardado na conta."}
                            {dominant.blockIndex === 2 && "Faz você trabalhar até se cansar demais por querer fazer tudo sozinho(a), sem conseguir passar tarefas para outras pessoas."}
                            {dominant.blockIndex === 3 && "Cria um limite invisível nos seus ganhos, fazendo você voltar para a zona de conforto toda vez que começa a prosperar mais."}
                            {dominant.blockIndex === 4 && "Provoca altos e baixos constantes no seu saldo: você ganha bem num momento, mas desacelera ou se distrai antes de colher os frutos."}
                            {dominant.blockIndex === 5 && "Paralisa suas escolhas financeiras porque você fica esperando a opinião ou aprovação de outras pessoas antes de agir."}
                          </p>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* =================================================================== */}
              {/* ETAPA 3: PLANO ESTRATÉGICO DE ALAVANCAGEM E INTEGRAÇÃO */}
              {/* =================================================================== */}
              <div className="bg-slate-900/90 rounded-2xl border border-indigo-500/30 p-6 sm:p-8 shadow-xl space-y-6">
                <div className="flex items-center gap-3 border-b border-slate-800 pb-4">
                  <div className="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center font-bold">
                    <Icon name="Target" className="w-6 h-6" />
                  </div>
                  <div>
                    <span className="text-xs font-mono font-bold text-indigo-400 uppercase tracking-widest">
                      ETAPA 3 DE 3 — SEU PLANO DE AÇÃO
                    </span>
                    <h3 className="text-xl sm:text-2xl font-black text-white">
                      Passo a Passo Prático para Resolver Seus Gargalos
                    </h3>
                  </div>
                </div>

                <div className="bg-slate-950/80 p-4 rounded-xl border border-slate-800 text-xs text-slate-300 space-y-2">
                  <strong className="text-amber-400 font-mono uppercase block tracking-wider">Como usar suas qualidades para mudar:</strong>
                  <p className="leading-relaxed">
                    Você não precisa inventar um jeito totalmente novo de agir. O segredo é usar a calma e a clareza que você já tem no seu ponto forte (<span className="text-emerald-400 font-bold">{strengthsList[0].shortTitle}</span>) para enfrentar de forma simples o seu maior desafio (<span className="text-rose-400 font-bold">{dominant1.shortTitle}</span>).
                  </p>
                </div>

                {/* Protocolo em 4 Fases Técnicas */}
                <div className="space-y-4 pt-2">
                  <h4 className="text-xs font-mono font-bold uppercase tracking-widest text-slate-400">
                    4 Passos Simples Para Aplicar na Sua Rotina
                  </h4>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    
                    <div className="bg-slate-950/80 p-4 rounded-xl border border-slate-800 space-y-2">
                      <div className="flex items-center gap-2">
                        <span className="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-mono font-bold text-[10px]">PASSO 01</span>
                        <h5 className="font-bold text-white uppercase">Pausa de 24 Horas Antes de Gastar</h5>
                      </div>
                      <p className="text-slate-300 leading-relaxed">
                        Antes de fazer um gasto fora do planejado, fechar um contrato na pressa ou mudar de plano sob estresse, espere até o dia seguinte. Essa pausa evita decisões tomadas pela emoção do momento.
                      </p>
                    </div>

                    <div className="bg-slate-950/80 p-4 rounded-xl border border-slate-800 space-y-2">
                      <div className="flex items-center gap-2">
                        <span className="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-mono font-bold text-[10px]">PASSO 02</span>
                        <h5 className="font-bold text-white uppercase">Dividir Tarefas com Outras Pessoas</h5>
                      </div>
                      <p className="text-slate-300 leading-relaxed">
                        Escolha 2 tarefas simples do seu dia a dia que tomam muito o seu tempo. Faça um passo a passo simples e peça ajuda a alguém, apenas conferindo o resultado final sem tentar fazer tudo sozinho(a).
                      </p>
                    </div>

                    <div className="bg-slate-950/80 p-4 rounded-xl border border-slate-800 space-y-2">
                      <div className="flex items-center gap-2">
                        <span className="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-mono font-bold text-[10px]">PASSO 03</span>
                        <h5 className="font-bold text-white uppercase">Guarde o Dinheiro Assim que Receber</h5>
                      </div>
                      <p className="text-slate-300 leading-relaxed">
                        Assim que qualquer valor entrar na sua conta, transfira imediatamente de 10% a 20% para uma conta de investimento ou reserva. Se o dinheiro não ficar no saldo do dia a dia, você não vai gastá-lo.
                      </p>
                    </div>

                    <div className="bg-slate-950/80 p-4 rounded-xl border border-slate-800 space-y-2">
                      <div className="flex items-center gap-2">
                        <span className="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-mono font-bold text-[10px]">PASSO 04</span>
                        <h5 className="font-bold text-white uppercase">Conversa Semanal de 15 Minutos</h5>
                      </div>
                      <p className="text-slate-300 leading-relaxed">
                        Toda sexta-feira no final do dia, reflita por 15 minutos: "O que eu fiz esta semana com calma e o que eu fiz por impulso ou ansiedade?". Faça pequenos ajustes para a semana seguinte.
                      </p>
                    </div>

                  </div>
                </div>

                <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div>
                    <span className="font-mono text-slate-200 font-bold block">Quando refazer esta avaliação?</span>
                    <span>Recomenda-se repetir este teste em 90 dias para ver claramente a sua evolução e a diminuição do seu nível de estresse.</span>
                  </div>
                </div>

              </div>

              {/* Botões do Rodapé do Resultado */}
              <div className="bg-slate-900/80 rounded-2xl border border-slate-800 p-5 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4">
                <button
                  onClick={handleCopyReport}
                  className="w-full sm:w-auto px-6 py-3 rounded-xl text-xs font-mono font-bold bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center gap-2 transition-all shadow-lg shadow-indigo-600/20"
                >
                  <Icon name="Copy" className="w-4 h-4" />
                  {copyStatus ? "Relatório Técnico Copiado!" : "Copiar Diagnóstico Completo em 3 Etapas"}
                </button>

                <div className="flex items-center gap-3 w-full sm:w-auto">
                  <button
                    onClick={() => {
                      setIsSubmitted(false);
                      window.scrollTo({ top: 0, behavior: 'smooth' });
                    }}
                    className="w-full sm:w-auto px-5 py-3 rounded-xl text-xs font-mono font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-all"
                  >
                    Revisar Respostas
                  </button>

                  <button
                    onClick={() => setShowResetModal(true)}
                    className="w-full sm:w-auto px-5 py-3 rounded-xl text-xs font-mono font-bold bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 flex items-center justify-center gap-2 transition-all"
                  >
                    <Icon name="RefreshCw" className="w-4 h-4" />
                    Novo Teste
                  </button>
                </div>
              </div>

            </div>
          )}

          {/* Menu Fixo Mobile */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/90 backdrop-blur-lg border-t border-slate-800 px-2 py-2">
            <div className="max-w-md mx-auto grid grid-cols-4 items-center justify-items-center">
              
              <button
                onClick={() => {
                  setIsSubmitted(false);
                  window.scrollTo({ top: 0, behavior: 'smooth' });
                }}
                className={`w-full flex flex-col items-center justify-center py-1 rounded-xl transition-all ${
                  !isSubmitted ? 'text-indigo-400 font-bold' : 'text-slate-500 hover:text-slate-300'
                }`}
              >
                <Icon name="Brain" className="w-5 h-5 mb-0.5" />
                <span className="text-[10px] font-mono">Questionário</span>
              </button>

              <button
                onClick={() => {
                  if (answeredCount === 0) {
                    setShowIncompleteModal(true);
                  } else {
                    setIsSubmitted(true);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                  }
                }}
                className={`w-full flex flex-col items-center justify-center py-1 rounded-xl transition-all relative ${
                  isSubmitted ? 'text-indigo-400 font-bold' : 'text-slate-500 hover:text-slate-300'
                }`}
              >
                <Icon name="BarChart3" className="w-5 h-5 mb-0.5" />
                <span className="text-[10px] font-mono">Diagnóstico</span>
                {answeredCount > 0 && !isSubmitted && (
                  <span className="absolute top-1 right-3 w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span>
                )}
              </button>

              <button
                onClick={handleCopyReport}
                className="w-full flex flex-col items-center justify-center py-1 rounded-xl text-slate-500 hover:text-slate-300 transition-all"
              >
                <Icon name="Copy" className="w-5 h-5 mb-0.5" />
                <span className="text-[10px] font-mono">{copyStatus ? 'Copiado' : 'Copiar'}</span>
              </button>

              <button
                onClick={() => setShowResetModal(true)}
                className="w-full flex flex-col items-center justify-center py-1 rounded-xl text-rose-400 hover:text-rose-300 transition-all"
              >
                <Icon name="RefreshCw" className="w-5 h-5 mb-0.5" />
                <span className="text-[10px] font-mono">Reiniciar</span>
              </button>

            </div>
          </nav>

          {/* Modal de Confirmação de Reset */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
              <div className="bg-slate-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-800 space-y-4">
                <div className="w-12 h-12 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30 flex items-center justify-center mx-auto">
                  <Icon name="RefreshCw" className="w-6 h-6" />
                </div>
                <div className="text-center">
                  <h3 className="text-lg font-bold text-white">Reiniciar Mapeamento?</h3>
                  <p className="text-slate-400 text-xs sm:text-sm mt-1">
                    Esta ação apagará todas as 60 respostas atuais e dados de identificação para um novo teste limpo.
                  </p>
                </div>
                <div className="flex items-center gap-3 pt-2">
                  <button
                    type="button"
                    onClick={() => setShowResetModal(false)}
                    className="flex-1 py-2.5 px-4 rounded-xl border border-slate-800 text-slate-300 text-xs font-mono font-bold hover:bg-slate-800 transition-colors"
                  >
                    Cancelar
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmReset}
                    className="flex-1 py-2.5 px-4 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-mono font-bold transition-colors shadow-lg shadow-rose-600/20"
                  >
                    Confirmar Reset
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal para Diagnóstico Incompleto */}
          {showIncompleteModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
              <div className="bg-slate-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-800 space-y-4">
                <div className="w-12 h-12 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center mx-auto">
                  <Icon name="ShieldAlert" className="w-6 h-6" />
                </div>
                <div className="text-center">
                  <h3 className="text-lg font-bold text-white">Questionário Incompleto</h3>
                  <p className="text-slate-400 text-xs sm:text-sm mt-1">
                    Você respondeu <strong>{answeredCount} de 60 itens</strong>. Para máxima acurácia técnica, recomenda-se o preenchimento de todos os blocos.
                  </p>
                </div>
                <div className="flex flex-col gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => {
                      setShowIncompleteModal(false);
                      setIsSubmitted(true);
                      window.scrollTo({ top: 0, behavior: 'smooth' });
                    }}
                    className="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-mono font-bold transition-colors shadow-lg shadow-indigo-600/20"
                  >
                    Gerar Diagnóstico Parcial
                  </button>
                  <button
                    type="button"
                    onClick={() => setShowIncompleteModal(false)}
                    className="w-full py-2.5 px-4 rounded-xl border border-slate-800 text-slate-300 text-xs font-mono font-bold hover:bg-slate-800 transition-colors"
                  >
                    Continuar Preenchimento
                  </button>
                </div>
              </div>
            </div>
          )}

          <footer className="mt-12 text-center text-xs text-slate-600 py-4 font-mono">
            Mapeamento Emocional Financeiro — Avaliação Comportamental de Precisão
          </footer>

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
